name: Deploy CHD CMR Academy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate and stage static site
        run: |
          test -s index.html
          mkdir -p _site
          cp index.html .nojekyll _site/
          python3 -c 'from pathlib import Path; import re; s=Path("index.html").read_text(); Path("/tmp/chd-site.js").write_text("\n".join(re.findall(r"<script[^>]*>(.*?)</script>",s,re.S)))'
          node --check /tmp/chd-site.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
