<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CHD CMR Academy</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#203449;background:#f5f7f9}header{background:white;border-bottom:1px solid #dce4eb;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:10px}h1,h2,h3,p{margin:0 0 12px}h1{font-size:clamp(22px,4vw,32px);letter-spacing:-1px}h2{font-size:23px}h3{font-size:16px}small,.muted{color:#667789}nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 5%;background:white;border-bottom:1px solid #dce4eb}button,select,input{font:inherit;border:1px solid #c9d5e0;border-radius:6px;padding:9px 12px;background:white;color:#203449}button{cursor:pointer}button.active,button.primary{background:#245b82;color:white;border-color:#245b82}button:hover{border-color:#245b82}main{max-width:1120px;margin:auto;padding:24px 16px}.panel{background:white;border:1px solid #dce4eb;border-radius:9px;padding:20px;margin:0 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.tile{text-align:left;display:block;width:100%;padding:16px;min-height:90px}.tile strong{display:block;font-size:17px}.eyebrow{font-size:12px;letter-spacing:1.2px;color:#397398;text-transform:uppercase;font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:15px}.calc{display:grid;grid-template-columns:1fr 1fr;gap:16px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #dce4eb;padding:10px;text-align:left}th{color:#536b80;background:#f2f6f9}input[type=number]{width:100%;min-width:70px}input[type=checkbox]{width:auto}svg{width:100%;height:auto;max-height:275px}svg [data-part]{cursor:pointer}.metrics{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0}.metric{min-width:120px}.metric b{display:block;font-size:28px;color:#245b82}.warning{border-left:3px solid #b77930;padding:8px 12px;background:#fcf8f0;font-size:13px;margin:10px 0}.diagram-label{font-size:13px;fill:#203449}.pill{font-size:12px;color:#667789}.footer{font-size:12px;color:#667789;padding:16px 0}a{color:#245b82} @media(max-width:700px){.calc{grid-template-columns:1fr}header{padding:14px}nav{padding:8px}button{padding:8px}main{padding:14px 10px}.panel{padding:14px}}
</style><header><div><div class="eyebrow">Clinical education · CMR</div><h1>CHD CMR Academy</h1><small id="tag"></small></div><button id="lang">EN</button></header><nav id="nav"></nav><main id="main"></main><script>

const T=(ru,en)=>L==='RU'?ru:en;let L='RU',tab=0,lesion='ASD',method='routine',part='',vals={},confirmed=false;const lesions={ASD:['ДМПП','Atrial septal defect',6],VSD:['ДМЖП','Ventricular septal defect',8],PDA:['ОАП','Patent ductus arteriosus',9],PAPVC:['ЧАДЛВ','Partial anomalous pulmonary venous connection',6],TAPVC:['ТАДЛВ','Total anomalous pulmonary venous connection',0],CoA:['Коарктация аорты','Coarctation of the aorta',0],ToF:['Тетрада Фалло','Tetralogy of Fallot',0],DORV:['ДОС от ПЖ','Double outlet right ventricle',0],TGA:['ТМА','Transposition of the great arteries',0],ccTGA:['КТМА','Congenitally corrected TGA',0],Glenn:['Гленн','Glenn circulation',0],Fontan:['Фонтен','Fontan circulation',0]};const names=()=>[T('Главная','Home'),T('Клиническая база','Clinical library'),T('Калькуляторы','Calculators'),T('CMR report','CMR report'),T('Лекции','Lectures'),T('Мини-книга','Handbook')];const supported=()=>!!lesions[lesion][2];const demo=()=>lesion==='PDA'?{rv:50,pa:50,lv:100,ao:100,qp:100,qs:50}:lesion==='VSD'?{rv:100,pa:150,lv:150,ao:100,qp:150,qs:100}:{rv:100,pa:100,lv:50,ao:50,qp:100,qs:50};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(n,l){tab=n;if(l&&l!==lesion){lesion=l;vals={};confirmed=false;part='';method='routine'}render()}function setLesion(l){go(tab,l)}function setMethod(m){method=m;confirmed=false;render()}function setVal(k,v){vals[k]=v===''?'':Number(v);update()}function get(k){const v=vals[k];return typeof v==='number'&&Number.isFinite(v)&&v>=0?v:null}function result(){if(!supported()||!confirmed)return null;const a=method==='manual'?get('qp'):get('pa'),b=method==='manual'?get('qs'):get('ao');if(a===null||b===null||a<=0||b<=0)return null;const qp=method==='routine'&&lesion==='PDA'?b:a,qs=method==='routine'&&lesion==='PDA'?a:b;return {qp,qs,r:qp/qs,d:qp-qs}}function fmt(v){return Number.isFinite(v)?v.toFixed(2).replace(/\.?0+$/,''):'—'}const formula=()=>method==='manual'?'Qp / Qs':lesion==='PDA'?'Ao net / MPA net':'MPA net / Ao net';const name=l=>lesions[l][L==='RU'?0:1];
function picker(){return `<div class="toolbar"><label>${T('Порок','Lesion')} <select onchange="setLesion(this.value)">${Object.keys(lesions).map(l=>`<option ${l===lesion?'selected':''} value="${l}">${l} · ${name(l)}</option>`).join('')}</select></label><span class="pill">${supported()?T('Учебная модель','Teaching model'):T('В разработке','In development')}</span></div>`}function info(){return lesion==='PDA'?T('Дистальный артериальный шунт: при изолированном ОАП весь дополнительный аортальный поток поступает в лёгкие. Измерять MPA проксимальнее впадения протока и Ao проксимальнее протока.','Distal arterial shunt: in isolated PDA, excess aortic flow enters the lungs. Measure MPA upstream of ductal entry and Ao upstream of ductus.'):lesion==='VSD'?T('Объёмная нагрузка преимущественно левых отделов. При изолированном VSD Qp = MPA net, Qs = Ao net.','Predominantly left-sided volume loading. In isolated VSD Qp = MPA net, Qs = Ao net.'):T('Объёмная нагрузка правых отделов; сравнить MPA net и Ao net. При ASD проверить лёгочные вены и сопутствующие клапанные нарушения.','Right-sided volume loading; compare MPA net and Ao net. For ASD assess pulmonary veins and associated valve abnormalities.')}
function diagram(){let path=lesion==='VSD'?'M153 178 L106 178':lesion==='PDA'?'M215 43 Q169 9 109 43':lesion==='PAPVC'?'M265 103 Q180 48 75 106':'M153 100 L106 100';return `<svg viewBox="0 0 320 240" role="img" aria-label="${T('Условная схема кровотока','Schematic circulation')}"><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#be8b45"/></marker></defs><path d="M76 153 Q38 127 47 83 Q49 60 76 63 L142 70 L166 62 Q245 43 250 111 Q265 179 174 222 Q121 215 76 153Z" fill="#f3f6f8" stroke="#a6b8c6"/><path d="M82 160 V45 Q82 23 109 23 H125" fill="none" stroke="#477ba3" stroke-width="17" data-part="pa" onclick="focusPart('pa')"/><path d="M184 180 V38 Q184 20 211 20 H237 V54" fill="none" stroke="#be6f73" stroke-width="17" data-part="ao" onclick="focusPart('ao')"/><path d="M66 50 V105" stroke="#477ba3" stroke-width="11"/><path d="M253 94 H205" stroke="#be6f73" stroke-width="10"/><rect x="48" y="80" width="80" height="48" rx="22" fill="#dcebf6" stroke="#477ba3"/><path d="M53 136 Q50 186 115 205 L145 158 L128 136Z" fill="#dcebf6" stroke="#477ba3" data-part="rv" onclick="focusPart('rv')"/><rect x="145" y="80" width="76" height="48" rx="22" fill="#f6e2e2" stroke="#be6f73"/><path d="M151 136 L151 202 Q220 224 231 136Z" fill="#f6e2e2" stroke="#be6f73" data-part="lv" onclick="focusPart('lv')"/><g class="diagram-label" text-anchor="middle"><text x="87" y="108">RA</text><text x="95" y="170">RV</text><text x="182" y="108">LA</text><text x="191" y="170">LV</text><text x="115" y="16">MPA</text><text x="221" y="14">Ao</text></g><path d="${path}" stroke="#be8b45" stroke-width="4" fill="none" marker-end="url(#arr)" data-part="shunt" onclick="focusPart('shunt')"/><circle cx="${lesion==='PDA'?164:lesion==='VSD'?139:lesion==='PAPVC'?171:139}" cy="${lesion==='PDA'?28:lesion==='VSD'?178:lesion==='PAPVC'?75:100}" r="8" fill="white" stroke="#be8b45" stroke-width="2" onclick="focusPart('shunt')"/></svg>`}function focusPart(p){part=p;const el=document.getElementById('part');if(el)el.textContent=partText();const i=document.getElementById('in-'+p);if(i)i.focus()}function partText(){return ({pa:T('MPA: измерение чистого потока в лёгочном стволе.','MPA: net main pulmonary artery flow.'),ao:T('Ao: измерение чистого потока в восходящей аорте.','Ao: net ascending aortic flow.'),rv:T('ПЖ: ударный объём по cine-волюметрии.','RV: cine-derived stroke volume.'),lv:T('ЛЖ: ударный объём по cine-волюметрии.','LV: cine-derived stroke volume.'),shunt:info()})[part]||T('Нажмите на сосуд, желудочек или область шунта. Схема условная, не анатомический атлас.','Select a vessel, ventricle or shunt. Schematic, not an anatomical atlas.')}
const row=(k,label)=>`<tr><td>${label}</td><td><input id="in-${k}" type="number" min="0" step="any" value="${esc(vals[k]??'')}" placeholder="—" oninput="setVal('${k}',this.value)"></td></tr>`;function update(){const r=result();const m=document.getElementById('metrics');if(m)m.innerHTML=[['Qp/Qs',r?fmt(r.r)+':1':'—'],['Qp',r?fmt(r.qp):'—'],['Qs',r?fmt(r.qs):'—'],[T('Qp−Qs','Qp−Qs'),r?fmt(r.d):'—']].map(([a,b])=>`<div class="metric"><small>${a}</small><b>${b}</b></div>`).join('');const s=document.getElementById('summary');if(s)s.textContent=summary();const w=document.getElementById('check');if(w){let k=lesion==='VSD'||lesion==='PDA'?'lv':'rv',v=get(k),p=get(lesion==='PDA'?'ao':'pa');w.textContent=r&&r.d<0?T('Отрицательный Qp−Qs: проверьте направление потоков, плоскости и сопутствующие дефекты.','Negative Qp−Qs: check flow directions, planes and associated lesions.'):v!==null&&p!==null?`${k.toUpperCase()}SV − ${lesion==='PDA'?'Ao':'MPA'} net = ${fmt(v-p)} ml/beat. `+T('Проверьте регургитацию и другие сообщения при расхождении.','If discrepant, check regurgitation and additional communications.'):T('Для проверки согласованности добавьте ударные объёмы.','Add stroke volumes for consistency checks.')}}function summary(){const r=result();return r?`${lesion}. Qp/Qs ${fmt(r.r)}:1; Qp ${fmt(r.qp)}, Qs ${fmt(r.qs)}, Qp−Qs ${fmt(r.d)} ml/beat. ${T('Учебная оценка, модель и измерения требуют верификации.','Educational estimate; model and measurements require verification.')}`:T('Недостаточно данных или не подтверждены допущения.','Insufficient data or assumptions not confirmed.')}function report(){return `<div class="panel"><h2>CMR report</h2>${picker()}<table id="reportTable"><tr><th>${T('Показатель','Parameter')}</th><th>${T('Значение','Value')}</th></tr>${[['RV SV',get('rv')],['MPA net',get('pa')],['LV SV',get('lv')],['Ao net',get('ao')],['Qp',result()?.qp],['Qs',result()?.qs],['Qp/Qs',result()?.r],['Qp−Qs',result()?.d]].map(([a,b])=>`<tr><td>${a}</td><td>${fmt(b)}</td></tr>`).join('')}</table><p class="muted">${T('Объёмы: мл/удар. Qp/Qs безразмерно.','Volumes: ml/beat. Qp/Qs dimensionless.')}</p><h3>Summary</h3><p>${esc(summary())}</p><button onclick="copyReport()">${T('Копировать таблицу и summary','Copy table and summary')}</button> <button onclick="go(2)">${T('К калькулятору','To calculator')}</button><p id="copyState"></p></div>`}async function copyReport(){let table=document.getElementById('reportTable');let plain=[...table.rows].map(r=>[...r.cells].map(c=>c.textContent).join('\t')).join('\n')+'\nSummary\n'+summary();try{if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([table.outerHTML+'<p>Summary</p><p>'+esc(summary())+'</p>'],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]);}else{await navigator.clipboard.writeText(plain)}document.getElementById('copyState').textContent=T('Скопировано','Copied')}catch(e){let a=document.createElement('textarea');a.value=plain;document.getElementById('copyState').append(a);a.select();document.execCommand('copy')}}
function render(){document.documentElement.lang=L.toLowerCase();document.getElementById('tag').textContent=T('МРТ врождённых пороков сердца','CMR in congenital heart disease');document.getElementById('lang').textContent=L==='RU'?'EN':'RU';document.getElementById('nav').innerHTML=names().map((n,i)=>`<button class="${i===tab?'active':''}" onclick="go(${i})">${n}</button>`).join('');let h='';if(tab===0){h=`<div class="panel"><div class="eyebrow">CHD · CMR · Education</div><h2>${T('От анатомии к гемодинамике','From anatomy to haemodynamics')}</h2><p>${T('Клиническая база, калькуляторы и структурированные протоколы МРТ врождённых пороков сердца.','Clinical library, calculators and structured CMR reporting for congenital heart disease.')}</p><button class="primary" onclick="go(2)">${T('Открыть калькулятор','Open calculator')}</button></div><div class="grid">${names().slice(1).map((n,i)=>`<button class="tile" onclick="go(${i+1})"><strong>${n}</strong><span class="muted">${i<3?T('Открытый доступ · прототип','Open access · prototype'):T('Планируемый раздел','Planned section')}</span></button>`).join('')}</div><h3 style="margin-top:24px">${T('Клинические модули','Clinical modules')}</h3><div class="grid">${Object.keys(lesions).map(l=>`<button class="tile" onclick="go(1,'${l}')"><strong>${l} · ${name(l)}</strong><span class="pill">${lesions[l][2]?T('Учебный пример','Teaching example'):T('В разработке','In development')}</span></button>`).join('')}</div>`}else if(tab===1){h=`<div class="panel"><h2>${T('Клиническая база','Clinical library')}</h2>${picker()}<h3>${lesion} · ${name(lesion)}</h3>${supported()?`<div class="calc"><div><h3>${T('Гемодинамика','Haemodynamics')}</h3><p>${info()}</p><h3>${T('План измерений','Flow plan')}</h3><table><tr><th>${T('Структура','Structure')}</th><th>${T('Метод','Method')}</th></tr><tr><td>RV / LV SV</td><td>Cine volumetry</td></tr><tr><td>MPA / Ao net</td><td>Through-plane PC</td></tr></table><p class="muted">Oliver Tann, EACVI 2024, p. ${lesions[lesion][2]}</p></div><div>${diagram()}<p id="part" class="muted">${partText()}</p></div></div><button class="primary" onclick="go(2)">${T('Рассчитать','Calculate')}</button>`:`<p>${T('Клинический модуль зарезервирован. Формулы и текст ещё не верифицированы.','Module reserved. Formulas and content not yet verified.')}</p>`}</div>`}else if(tab===2){h=`<div class="panel"><h2>${T('Калькулятор шунтов','Shunt calculator')}</h2>${picker()}${supported()?`<div class="toolbar"><button class="${method==='routine'?'active':''}" onclick="setMethod('routine')">Recommended</button><button class="${method==='manual'?'active':''}" onclick="setMethod('manual')">Manual Qp/Qs</button><button onclick="vals=demo();confirmed=false;render()">${T('Пример Tann','Tann example')}</button><button onclick="vals={};confirmed=false;render()">${T('Очистить','Clear')}</button></div><div class="calc"><div><table><tr><th>${T('Параметр','Parameter')}</th><th>ml/beat</th></tr>${row('rv','RV SV')}${row('pa','MPA net')}${row('lv','LV SV')}${row('ao','Ao net')}${method==='manual'?row('qp','Qp')+row('qs','Qs'):''}</table><p class="muted">${T('Метод','Method')}: ${formula()}</p></div><div>${diagram()}<p id="part" class="muted">${partText()}</p></div></div><div class="warning">${method==='routine'?T('Только изолированный порок; net flow, одинаковые единицы и корректные плоскости. При дополнительных шунтах или необычной анатомии нужна другая модель.','Isolated lesion only; net flow, same units and valid planes. Additional shunts or unusual anatomy require another model.'):T('Qp и Qs должны соответствовать фактическим потокам через лёгочное и системное сосудистые русла.','Qp and Qs must represent actual pulmonary and systemic vascular bed flows.')}<br><label><input type="checkbox" ${confirmed?'checked':''} onchange="confirmed=this.checked;update()"> ${T('Допущения подтверждены (учебный режим)','Assumptions confirmed (educational mode)')}</label></div><div id="metrics" class="metrics"></div><p id="check" class="muted"></p><h3>Summary</h3><p id="summary"></p><button class="primary" onclick="go(3)">CMR report</button>`:`<p>${T('Автоматический расчёт для этого порока заблокирован до проверки модели.','Automatic calculation disabled until model review.')}</p>`}</div>`}else if(tab===3)h=report();else h=`<div class="panel"><h2>${names()[tab]}</h2><p>${T('Раздел будущего авторского платного контента. Материалы, цены и оплату пока не добавляли.','Reserved for future paid author content. Materials, prices and payments not added.')}</p></div>`;document.getElementById('main').innerHTML=h+`<div class="footer">${T('Учебный прототип · не для самостоятельных клинических решений · ручная верификация обязательна. Данные не отправляются на сервер.','Educational prototype · not for standalone clinical decisions · manual verification required. No data sent to server.')} <a href="https://scmr.org/scmr-reporting-templates/" target="_blank" rel="noopener">SCMR reporting templates</a></div>`;update()}document.getElementById('lang').onclick=()=>{L=L==='RU'?'EN':'RU';render()};render();</script></html>
